<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link id="site-icon" rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Romantiku monogatari</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap');
    :root { color-scheme: dark; --display-font: "Cinzel", Georgia, serif; --ui-font: "Rajdhani", "Trebuchet MS", sans-serif; font-family: var(--ui-font); background: #090914; color: #fff4ff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 15% 0%, #4f275c, transparent 34%), radial-gradient(circle at 90% 18%, #152d57, transparent 35%), #090914; min-height: 100vh; position: relative; }
    body::after { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .24; background-image: linear-gradient(115deg, transparent 0 48%, rgba(255, 182, 246, .16) 49%, transparent 50%), linear-gradient(25deg, transparent 0 48%, rgba(151, 226, 255, .1) 49%, transparent 50%); background-size: 180px 180px, 240px 240px; }
    body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(rgba(9, 9, 20, .48), rgba(9, 9, 20, .84)), var(--page-background, none) center / cover no-repeat; filter: saturate(.9); }
    #background-video { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; display: none; filter: saturate(.75); }
    #background-video.visible { display: block; }
    body.video-background::before { background: linear-gradient(rgba(9, 9, 20, .48), rgba(9, 9, 20, .84)); }
    main { position: relative; z-index: 1; max-width: 1120px; margin: auto; padding: 72px 20px 48px; }
    .control-tray { position: fixed; z-index: 3; top: 18px; left: 20px; width: min(340px, calc(100% - 40px)); padding: 14px; background: rgba(16, 14, 32, .88); border: 1px solid rgba(255, 186, 241, .48); border-radius: 3px; box-shadow: 0 0 28px rgba(213, 103, 221, .16); font-family: var(--ui-font); backdrop-filter: blur(14px); }
    .control-tray summary { cursor: pointer; color: #ffc3f5; font-weight: bold; letter-spacing: .08em; text-transform: uppercase; }
    .control-tray summary::before { content: "✦"; margin-right: 8px; color: #a9d9ff; }
    .control-tray summary::marker { color: #a9d9ff; }
    .tray-section { margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(185, 169, 255, .25); }
    .tray-section h2 { margin: 0 0 10px; font-family: var(--display-font); font-size: 1rem; color: #ffe6fb; }
    .control-tray form { display: grid; gap: 8px; }
    .control-tray .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .control-tray button { padding: 9px; }
    .login-status { color: #d5c7e5; font-size: 12px; min-height: 16px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 32px; }
    h1 { color: #fce9ff; font-family: var(--display-font); font-size: clamp(2.5rem, 7vw, 5.5rem); line-height: .86; margin: 0; letter-spacing: .02em; text-shadow: 0 0 24px rgba(255, 139, 232, .58); }
    p { color: #f89ae8; margin: 10px 0 0; font-family: var(--ui-font); font-weight: 500; letter-spacing: .03em; }
    .tools { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 28px; padding: 12px; background: rgba(12, 13, 33, .68); border: 1px solid rgba(160, 194, 255, .3); border-radius: 3px; box-shadow: 0 14px 40px rgba(0, 0, 0, .2); }
    input, button { border: 1px solid rgba(185, 169, 255, .46); border-radius: 2px; padding: 12px 14px; font: 600 15px var(--ui-font); letter-spacing: .03em; }
    input { background: rgba(14, 14, 35, .88); color: #fff; min-width: 0; }
    input:focus { outline: 1px solid #ff9de9; box-shadow: 0 0 14px rgba(255, 157, 233, .22); }
    button { background: linear-gradient(115deg, #ff9bdc, #b79cff); border-color: #ffc3f5; color: #241536; cursor: pointer; font-weight: bold; }
    button:hover { background: linear-gradient(115deg, #ffd0f2, #c5c1ff); }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { overflow: hidden; background: rgba(17, 16, 39, .82); border: 1px solid rgba(220, 174, 255, .34); border-radius: 3px; box-shadow: 0 14px 32px rgba(0, 0, 0, .3); transition: transform .2s ease, border-color .2s ease; }
    .card:hover { transform: translateY(-4px); border-color: rgba(255, 192, 242, .78); }
    .card-actions { display: flex; gap: 8px; padding: 0 12px 12px; }
    .card-actions button { padding: 7px 10px; font-size: 13px; }
    .card img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #30282a; }
    .card img { cursor: zoom-in; }
    .meta { padding: 12px; font-family: var(--ui-font); font-weight: 500; }
    .filename { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tags { color: #ffb9e9; font-size: 13px; margin-top: 7px; }
    .upload { display: grid; gap: 8px; }
    .status { min-height: 22px; color: #ffc3f5; font: 600 14px var(--ui-font); letter-spacing: .04em; }
    .viewer { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px; background: rgba(0, 0, 0, .88); }
    .viewer[hidden] { display: none; }
    .viewer img { max-width: 95vw; max-height: 88vh; object-fit: contain; }
    .viewer-close { position: absolute; top: 18px; right: 24px; padding: 4px 12px; background: transparent; color: #fff; border: 1px solid #aaa; font-size: 28px; }
    .viewer-name { position: absolute; bottom: 18px; color: #fff; font: 600 15px var(--ui-font); letter-spacing: .05em; }
    .edit-view { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: 24px; background: rgba(5, 5, 16, .86); backdrop-filter: blur(10px); }
    .edit-view[hidden] { display: none; }
    .edit-panel { display: grid; grid-template-columns: minmax(220px, 360px) minmax(260px, 420px); gap: 26px; width: min(820px, 100%); padding: 24px; background: rgba(16, 14, 38, .96); border: 1px solid rgba(255, 186, 241, .58); box-shadow: 0 0 45px rgba(213, 103, 221, .28); }
    .edit-preview { width: 100%; aspect-ratio: 1; object-fit: cover; border: 1px solid rgba(169, 217, 255, .4); }
    .edit-form { display: grid; align-content: center; gap: 12px; }
    .edit-form h2 { margin: 0; color: #ffe6fb; font-family: var(--display-font); }
    .edit-form label { color: #d5c7e5; font-size: 13px; letter-spacing: .04em; }
    .edit-actions { display: flex; gap: 10px; margin-top: 8px; }
    .edit-actions button[type="button"] { background: transparent; color: #fce9ff; }
    .edit-status { min-height: 20px; color: #ffc3f5; }
    .confirm-view { position: fixed; inset: 0; z-index: 11; display: grid; place-items: center; padding: 24px; background: rgba(5, 5, 16, .86); backdrop-filter: blur(10px); }
    .confirm-view[hidden] { display: none; }
    .confirm-panel { width: min(440px, 100%); padding: 26px; background: rgba(16, 14, 38, .97); border: 1px solid rgba(255, 186, 241, .58); box-shadow: 0 0 45px rgba(213, 103, 221, .28); text-align: center; }
    .confirm-panel h2 { margin: 0 0 10px; color: #ffe6fb; font-family: var(--display-font); }
    .confirm-message { color: #d5c7e5; margin: 0 0 20px; }
    .confirm-actions { display: flex; justify-content: center; gap: 10px; }
    .confirm-actions button[type="button"] { background: transparent; color: #fce9ff; }
    @media (max-width: 650px) { .edit-panel { grid-template-columns: 1fr; max-height: 90vh; overflow-y: auto; } .edit-preview { max-height: 42vh; } }
    @media (max-width: 650px) { header { display: block; } .control-tray { left: 12px; width: calc(100% - 24px); } }
  </style>
</head>
<body>
  <video id="background-video" autoplay muted loop playsinline aria-hidden="true"></video>
  <details class="control-tray" open>
    <summary>Control tray</summary>
    <section class="tray-section">
      <h2 id="account-label">Login / Register</h2>
      <form id="auth-form">
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Password" minlength="6" required>
        <div class="actions"><button type="submit" data-action="login">↪ Login</button><button type="submit" data-action="register">✦ Register</button></div>
        <button id="logout" type="button" hidden>↩ Logout</button>
        <div id="auth-status" class="login-status"></div>
      </form>
    </section>
    <section class="tray-section">
      <h2>Upload image</h2>
      <form id="upload">
        <input id="file" type="file" accept="image/*" required>
        <input id="filename" placeholder="Displayed image name" maxlength="120" required>
        <input id="tags" placeholder="Tags: cat, animal, night">
        <button>↑ Upload</button>
      </form>
      <p id="upload-status">Login first, then choose an image to upload.</p>
    </section>
  </details>
  <div id="viewer" class="viewer" hidden>
    <button id="viewer-close" class="viewer-close" type="button" aria-label="Close full screen view">&times;</button>
    <img id="viewer-image" alt="">
    <div id="viewer-name" class="viewer-name"></div>
  </div>
  <section id="edit-view" class="edit-view" hidden aria-label="Edit image">
    <div class="edit-panel">
      <img id="edit-preview" class="edit-preview" alt="">
      <form id="edit-form" class="edit-form">
        <h2>Edit image</h2>
        <label for="edit-filename">Displayed name</label>
        <input id="edit-filename" maxlength="120" required>
        <label for="edit-tags">Tags, separated by commas</label>
        <input id="edit-tags" placeholder="cat, animal, night">
        <div id="edit-status" class="edit-status"></div>
        <div class="edit-actions"><button type="submit">Save changes</button><button id="edit-cancel" type="button">Cancel</button></div>
      </form>
    </div>
  </section>
  <section id="confirm-view" class="confirm-view" hidden aria-label="Confirm action">
    <div class="confirm-panel">
      <h2 id="confirm-title">Confirm action</h2>
      <p id="confirm-message" class="confirm-message"></p>
      <div class="confirm-actions"><button id="confirm-accept" type="button">Confirm</button><button id="confirm-cancel" type="button">Cancel</button></div>
    </div>
  </section>
  <main>
    <header><div><h1>Ellysia<br>JS</h1><p>Browse, search, and test your image API.</p></div><div id="status" class="status"></div></header>
    <form id="search" class="tools"><input id="tag" placeholder="Search by tag, e.g. cat"><button>⌕ Search</button></form>
    <section id="gallery" class="gallery"></section>
  </main>
  <script>
    const gallery = document.querySelector('#gallery');
    const status = document.querySelector('#status');
    let supabaseConfig = { supabaseUrl: '', supabaseAnonKey: '' };
    let currentUser = null;
    const token = () => window.localStorage.getItem('booru-token') || '';
    const setStatus = (text) => { status.textContent = text; };
    const authStatus = document.querySelector('#auth-status');
    const accountLabel = document.querySelector('#account-label');
    const logout = document.querySelector('#logout');
    const filenameInput = document.querySelector('#filename');
    const viewer = document.querySelector('#viewer');
    const viewerImage = document.querySelector('#viewer-image');
    const viewerName = document.querySelector('#viewer-name');
    const editView = document.querySelector('#edit-view');
    const editForm = document.querySelector('#edit-form');
    const editPreview = document.querySelector('#edit-preview');
    const editFilename = document.querySelector('#edit-filename');
    const editTags = document.querySelector('#edit-tags');
    const editStatus = document.querySelector('#edit-status');
    let editingImageId = null;
    const confirmView = document.querySelector('#confirm-view');
    const confirmTitle = document.querySelector('#confirm-title');
    const confirmMessage = document.querySelector('#confirm-message');
    let confirmResult = null;

    function askConfirmation(title, message) {
      confirmTitle.textContent = title;
      confirmMessage.textContent = message;
      confirmView.hidden = false;
      return new Promise((resolve) => { confirmResult = resolve; });
    }

    function finishConfirmation(result) {
      confirmView.hidden = true;
      if (confirmResult) confirmResult(result);
      confirmResult = null;
    }

    document.querySelector('#confirm-accept').addEventListener('click', () => finishConfirmation(true));
    document.querySelector('#confirm-cancel').addEventListener('click', () => finishConfirmation(false));
    confirmView.addEventListener('click', (event) => { if (event.target === confirmView) finishConfirmation(false); });

    function updateAccount() {
      const loggedIn = Boolean(token());
      accountLabel.textContent = loggedIn ? 'Account connected' : 'Login / Register';
      logout.hidden = !loggedIn;
    }

    async function loadCurrentUser() {
      const accessToken = token();
      if (!accessToken) { currentUser = null; return; }
      const response = await fetch('/me', { headers: { Authorization: `Bearer ${accessToken}` } });
      currentUser = response.ok ? await response.json() : null;
    }

    async function authenticate(action) {
      if (!supabaseConfig.supabaseUrl || !supabaseConfig.supabaseAnonKey) {
        authStatus.textContent = 'Add SUPABASE_ANON_KEY to .env first.';
        return;
      }
      const endpoint = action === 'register' ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password';
      const response = await fetch(`${supabaseConfig.supabaseUrl}${endpoint}`, {
        method: 'POST', headers: { apikey: supabaseConfig.supabaseAnonKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.querySelector('#email').value, password: document.querySelector('#password').value })
      });
      const result = await response.json();
      if (!response.ok) { authStatus.textContent = result.msg || result.error_description || result.message || 'Authentication failed'; return; }
      if (result.access_token) { window.localStorage.setItem('booru-token', result.access_token); await loadCurrentUser(); authStatus.textContent = 'Login successful.'; updateAccount(); loadImages(); }
      else authStatus.textContent = 'Registration successful. Confirm your email, then login.';
    }

    document.querySelector('#auth-form').addEventListener('submit', (event) => { event.preventDefault(); authenticate(event.submitter.dataset.action); });
    logout.addEventListener('click', () => { window.localStorage.removeItem('booru-token'); currentUser = null; authStatus.textContent = 'Logged out.'; updateAccount(); loadImages(); });

    async function loadImages() {
      const tag = document.querySelector('#tag').value.trim();
      setStatus('Loading...');
      const response = await fetch(tag ? `/search?tag=${encodeURIComponent(tag)}` : '/images');
      const images = await response.json();
      gallery.innerHTML = images.length ? images.map((image) => {
        const canManage = currentUser && (currentUser.role === 'admin' || currentUser.id === image.uploaded_by);
        const actions = canManage ? `<div class="card-actions"><button type="button" data-edit-id="${image.id}">✎ Edit</button><button type="button" data-delete-id="${image.id}">× Delete</button></div>` : '';
        return `<article class="card"><img src="${image.url}" alt="${image.filename}" data-full-image="${image.url}" data-image-name="${image.filename}"><div class="meta"><div class="filename">${image.filename}</div><div class="tags">${image.tags.map((item) => `#${item}`).join(' ')}</div></div>${actions}</article>`;
      }).join('') : '<p>No images found.</p>';
      setStatus(`${images.length} image${images.length === 1 ? '' : 's'}`);
    }

    gallery.addEventListener('click', async (event) => {
      const editButton = event.target.closest('[data-edit-id]');
      const deleteButton = event.target.closest('[data-delete-id]');
      const accessToken = token();
      if (editButton) {
        const response = await fetch(`/images/${editButton.dataset.editId}`);
        if (!response.ok) { setStatus(`Edit failed: ${response.status}`); return; }
        const image = await response.json();
        editingImageId = image.id;
        editPreview.src = image.url;
        editPreview.alt = image.filename;
        editFilename.value = image.filename;
        editTags.value = image.tags.join(', ');
        editStatus.textContent = '';
        editView.hidden = false;
        return;
      }
      if (deleteButton) {
        const confirmed = await askConfirmation('Delete image?', 'This image and its stored file will be permanently deleted.');
        if (!confirmed) return;
        const response = await fetch(`/images/${deleteButton.dataset.deleteId}`, { method: 'DELETE', headers: { Authorization: `Bearer ${accessToken}` } });
        setStatus(response.ok ? 'Image deleted.' : `Delete failed: ${response.status}`);
        if (response.ok) loadImages();
      }
    });

    editForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      editStatus.textContent = 'Saving changes...';
      const response = await fetch(`/images/${editingImageId}`, { method: 'PATCH', headers: { Authorization: `Bearer ${token()}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ filename: editFilename.value.trim(), tags: editTags.value.split(',').map((tag) => tag.trim().toLowerCase()).filter(Boolean) }) });
      if (!response.ok) { editStatus.textContent = `Save failed: ${response.status}`; return; }
      editView.hidden = true;
      setStatus('Image updated.');
      loadImages();
    });
    document.querySelector('#edit-cancel').addEventListener('click', () => { editView.hidden = true; });
    editView.addEventListener('click', (event) => { if (event.target === editView) editView.hidden = true; });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') editView.hidden = true; });

    document.querySelector('#file').addEventListener('change', (event) => {
      if (!filenameInput.value) filenameInput.value = event.target.files[0]?.name || '';
    });
    gallery.addEventListener('click', (event) => {
      const image = event.target.closest('img[data-full-image]');
      if (!image) return;
      viewerImage.src = image.dataset.fullImage;
      viewerImage.alt = image.dataset.imageName;
      viewerName.textContent = image.dataset.imageName;
      viewer.hidden = false;
    });
    function closeViewer() { viewer.hidden = true; viewerImage.src = ''; }
    document.querySelector('#viewer-close').addEventListener('click', closeViewer);
    viewer.addEventListener('click', (event) => { if (event.target === viewer) closeViewer(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeViewer(); });

    document.querySelector('#search').addEventListener('submit', (event) => { event.preventDefault(); loadImages(); });
    document.querySelector('#upload').addEventListener('submit', async (event) => {
      event.preventDefault();
      const uploadStatus = document.querySelector('#upload-status');
      const file = document.querySelector('#file').files[0];
      const accessToken = token();
      if (!accessToken) { uploadStatus.textContent = 'Please login before uploading.'; return; }
      if (!file) { uploadStatus.textContent = 'Choose an image first.'; return; }
      const confirmed = await askConfirmation('Upload image?', `Upload "${file.name}" to the gallery?`);
      if (!confirmed) { uploadStatus.textContent = 'Upload cancelled.'; return; }
      uploadStatus.textContent = 'Uploading image...';
      const body = new FormData();
      body.append('image', file);
      body.append('filename', filenameInput.value.trim() || file.name);
      body.append('tags', document.querySelector('#tags').value);
      try {
        const response = await fetch('/images', { method: 'POST', headers: { Authorization: `Bearer ${accessToken}` }, body });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `Upload failed: ${response.status}`);
        uploadStatus.textContent = `Upload completed: ${result.filename}`;
        setStatus('Upload completed.');
        event.target.reset();
        loadImages();
      } catch (error) {
        uploadStatus.textContent = `Upload failed: ${error.message}`;
        setStatus('Upload failed.');
      }
    });
    fetch('/config').then((response) => response.json()).then(async (config) => {
      supabaseConfig = config;
      if (config.faviconUrl) document.querySelector('#site-icon').href = config.faviconUrl;
      const backgroundVideo = document.querySelector('#background-video');
      if (config.backgroundVideoUrl) {
        backgroundVideo.src = config.backgroundVideoUrl;
        backgroundVideo.classList.add('visible');
        document.body.classList.add('video-background');
        backgroundVideo.play().catch(() => {});
      } else if (config.backgroundUrl) {
        document.body.style.setProperty('--page-background', `url("${config.backgroundUrl}")`);
      }
      await loadCurrentUser();
      updateAccount();
      loadImages();
    });
  </script>
</body>
</html>
